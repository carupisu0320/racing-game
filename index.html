<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Open World Driving Game</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #87CEEB; }
  canvas { display: block; }
  #game-root {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  #hud {
    position: absolute; top: 10px; left: 10px;
    font-family: sans-serif; color: #fff;
    text-shadow: 0 0 4px #000;
    font-size: 14px; pointer-events: none;
    z-index: 10;
  }
  #radioLabel {
    position: absolute; top: 34px; left: 10px;
    font-family: sans-serif; color: #fff;
    text-shadow: 0 0 4px #000;
    font-size: 13px; pointer-events: none;
    z-index: 10;
  }
  #speedGauge {
    position: absolute; right: 16px; bottom: 16px;
    pointer-events: none;
    z-index: 10;
  }
  #editorPanel {
    position: absolute; top: 10px; right: 16px;
    font-family: sans-serif; font-size: 13px; color: #fff;
    background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px;
    display: none; z-index: 20; max-width: 260px;
  }
  #editorPanel.active { display: block; }
  #editorExport {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 70vw; height: 50vh; z-index: 30; display: none;
    font-family: monospace; font-size: 12px;
  }
  #mapOverlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(20, 20, 25, 0.75);
    display: none; z-index: 25;
    align-items: center; justify-content: center;
  }
  #mapOverlay.active { display: flex; }
  #mapCanvas {
    background: #d8c9a3;
    border: 3px solid #fff;
    border-radius: 8px;
  }
</style>
</head>
<body>
<div id="game-root">
<div id="hud">矢印キー / WASD で運転 ・ ドラッグでマウス視点操作 ・ Cキーで一人称/三人称切り替え ・ Eキーで編集モード(開発者用) ・ -/;キーでラジオ局切り替え ・ Mキーでマップ ・ Hキーでクラクション ・ Spaceキーでサイドブレーキ(ドリフト)</div>
<div id="radioLabel"></div>
<div id="mapOverlay"><canvas id="mapCanvas" width="700" height="700"></canvas></div>
<canvas id="speedGauge" width="150" height="150"></canvas>
<div id="editorPanel">
  <b>開発者編集モード(Eキーで終了)</b><br>
  現在の種類: <span id="editorTypeLabel">building</span><br>
  1:ビル 2:木 3:目印 4:道路 5:丘 で種類切り替え<br>
  道路はクリックした点を順につなぎます(Rキーで新しい道路を開始)<br>
  丘はクリックした場所を盛り上げます<br>
  クリックで配置 / Zキーで最後を取り消し<br>
  Pキーでデータを書き出す
</div>
<textarea id="editorExport"></textarea>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function() {
// ==========================================================
// シーン・カメラ・レンダラー
// ==========================================================
const gameRoot = document.getElementById('game-root');

const scene = new THREE.Scene();

// 車のタイヤの接地判定に使う「実際に運転できる面」のメッシュ一覧。
// 地形の高さ関数(terrainHeight)だけでは、高架の高速道路やランプのような
// 「地形とは別に自由な高さを持つ道路」を考慮できず、めり込みの原因になっていた。
// そこで、実際に描画されているメッシュへ向けて下向きにレイを飛ばし、
// 本当に立っている面の高さを取得するようにする。
const groundMeshes = [];
const groundRaycaster = new THREE.Raycaster();
groundRaycaster.far = 2000;

// サボテン・岩との当たり判定に使う一覧。{ mesh, x, z, radius } を保持する。
const cactusObstacles = [];
const rockObstacles = [];

// 描写距離: マップが広くなっても常に全オブジェクトを描画すると重くなるため、
// 車から一定距離より遠いサボテンは非表示にして負荷を抑える
// (岩はInstancedMeshで1回の描画にまとめているため、個別のカリングは不要)
const DRAW_DISTANCE = 700;
const DRAW_DISTANCE_SQ = DRAW_DISTANCE * DRAW_DISTANCE;
let cullFrameCounter = 0;
function updateDistanceCulling() {
  // 判定自体もコストなので、毎フレームではなく4フレームに1回だけ行う
  // (見た目の切り替わりは4フレーム程度の遅れなら気にならない)
  cullFrameCounter++;
  if (cullFrameCounter % 4 !== 0) return;
  for (const obs of cactusObstacles) {
    const dx = car.position.x - obs.x, dz = car.position.z - obs.z;
    obs.mesh.visible = (dx * dx + dz * dz) < DRAW_DISTANCE_SQ;
  }
}

// マップの表示モード(空や地面の色分けにも使うため、シーン作成直後に定義しておく)
// スーパーフラットモード: 地形・ビル・木・道路・高速道路をすべて取り除き、何もない平らな地面だけにする(編集モードで一から配置するため)
// ルート66モード: 砂漠を貫くハイウェイのマップ
const SUPERFLAT_MODE = false;
const ROUTE66_MODE = true;

scene.background = new THREE.Color(ROUTE66_MODE ? 0xbfdff0 : 0x87CEEB);
scene.fog = new THREE.Fog(ROUTE66_MODE ? 0xd8c9a3 : 0x87CEEB, 250, 1500);

const camera = new THREE.PerspectiveCamera(
  70, window.innerWidth / window.innerHeight, 0.1, 4000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.domElement.style.position = 'absolute';
renderer.domElement.style.top = '0';
renderer.domElement.style.left = '0';
renderer.domElement.style.zIndex = '1';
gameRoot.insertBefore(renderer.domElement, gameRoot.firstChild);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ==========================================================
// ライト
// ==========================================================
const hemi = new THREE.HemisphereLight(0xffffff, 0x445533, 0.9);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(80, 120, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -150;
sun.shadow.camera.right = 150;
sun.shadow.camera.top = 150;
sun.shadow.camera.bottom = -150;
sun.shadow.bias = -0.0005;
scene.add(sun);

// 影を和らげる補助ライト(反対側からの弱い光でコントラストを抑える)
const fillLight = new THREE.DirectionalLight(0xaaccff, 0.35);
fillLight.position.set(-60, 50, -80);
scene.add(fillLight);

// ==========================================================
// 地形の骨格(郊外・街・山道の配置プレースホルダー)
// 平面地形 + ざっくりしたゾーン分け。細部は次のステップで作り込む。
// ==========================================================

// 地形の高さを計算する共通関数。
// 街エリア(z が -60 より大きい)は平坦、山道エリア(z が -160 より小さい)は起伏あり、
// その間はなめらかに切り替わるようにして、急な段差ができないようにしている。
function smoothstep(edge0, edge1, x) {
  const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

// ==========================================================
// 実在の地形(サンフランシスコ)の標高データ取得
// 起動時に公開の標高API(Open-Elevation)から取得し、成功すれば実在の起伏を使う。
// 取得に失敗した場合(オフライン・API不調など)は、従来のsin/cosによる
// 簡易的な起伏にフォールバックする。
// ==========================================================
const sfBounds = { south: 37.705, north: 37.812, west: -122.515, east: -122.365 };
const worldSpanX = 300; // ワールド座標でのX方向の広さ
const worldSpanZ = 270; // ワールド座標でのZ方向の広さ
const elevationScale = 1 / 12; // 実際の標高(メートル)をゲーム内の高さに縮小する係数
let realElevationGrid = null; // { grid, gridRes } 取得成功時にセットされる

function worldXToLon(x) {
  return sfBounds.west + (x + worldSpanX / 2) / worldSpanX * (sfBounds.east - sfBounds.west);
}
function worldZToLat(z) {
  return sfBounds.south + (z + worldSpanZ / 2) / worldSpanZ * (sfBounds.north - sfBounds.south);
}
function lonToWorldX(lon) {
  return (lon - sfBounds.west) / (sfBounds.east - sfBounds.west) * worldSpanX - worldSpanX / 2;
}
function latToWorldZ(lat) {
  return (lat - sfBounds.south) / (sfBounds.north - sfBounds.south) * worldSpanZ - worldSpanZ / 2;
}

// 実際の道路網(OpenStreetMap)を取得する。主要な通りに絞って取得件数を抑えている。
async function fetchSanFranciscoRoads() {
  const query = '[out:json][timeout:25];way["highway"~"^(motorway|trunk|primary|secondary|tertiary)$"]' +
    '(' + sfBounds.south + ',' + sfBounds.west + ',' + sfBounds.north + ',' + sfBounds.east + ');out geom;';
  const response = await fetch('https://overpass-api.de/api/interpreter', {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: query
  });
  if (!response.ok) throw new Error('overpass API status ' + response.status);
  const data = await response.json();
  if (!data.elements || data.elements.length === 0) throw new Error('道路データが空でした');
  return data.elements;
}

async function fetchSanFranciscoElevation() {
  const gridRes = 21;
  const locations = [];
  for (let latI = 0; latI < gridRes; latI++) {
    const lat = sfBounds.south + (latI / (gridRes - 1)) * (sfBounds.north - sfBounds.south);
    for (let lonI = 0; lonI < gridRes; lonI++) {
      const lon = sfBounds.west + (lonI / (gridRes - 1)) * (sfBounds.east - sfBounds.west);
      locations.push({ latitude: lat, longitude: lon });
    }
  }

  const response = await fetch('https://api.open-elevation.com/api/v1/lookup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ locations })
  });
  if (!response.ok) throw new Error('elevation API status ' + response.status);
  const data = await response.json();
  const results = data.results;
  if (!results || results.length !== gridRes * gridRes) throw new Error('unexpected elevation response');

  let minH = Infinity;
  for (const r of results) minH = Math.min(minH, r.elevation);

  const grid = [];
  let idx = 0;
  for (let latI = 0; latI < gridRes; latI++) {
    const row = [];
    for (let lonI = 0; lonI < gridRes; lonI++) {
      row.push((results[idx].elevation - minH) * elevationScale);
      idx++;
    }
    grid.push(row);
  }
  return { grid, gridRes };
}

function sampleRealElevation(x, z) {
  const lon = worldXToLon(x);
  const lat = worldZToLat(z);
  const clampedLon = Math.min(sfBounds.east, Math.max(sfBounds.west, lon));
  const clampedLat = Math.min(sfBounds.north, Math.max(sfBounds.south, lat));
  const { grid, gridRes } = realElevationGrid;
  const fx = (clampedLon - sfBounds.west) / (sfBounds.east - sfBounds.west) * (gridRes - 1);
  const fz = (clampedLat - sfBounds.south) / (sfBounds.north - sfBounds.south) * (gridRes - 1);
  const x0 = Math.floor(fx), x1 = Math.min(gridRes - 1, x0 + 1);
  const z0 = Math.floor(fz), z1 = Math.min(gridRes - 1, z0 + 1);
  const tx = fx - x0, tz = fz - z0;
  const h00 = grid[z0][x0], h10 = grid[z0][x1], h01 = grid[z1][x0], h11 = grid[z1][x1];
  const h0 = h00 * (1 - tx) + h10 * tx;
  const h1 = h01 * (1 - tx) + h11 * tx;
  return h0 * (1 - tz) + h1 * tz;
}

// 実在の標高・道路データの取得は重くなるため無効化し、
// 従来のプレースホルダーの地形・ループ道路を使う
let osmRoadElements = [];
realElevationGrid = null;

// 砂漠に点在するメサ(岩山)の位置。地形のなだらかな盛り上がりとして使う
const desertMesas = [
  { x: -60, z: 120, radius: 35, height: 14 },
  { x: 90, z: -80, radius: 45, height: 18 },
  { x: -110, z: -140, radius: 30, height: 11 },
  { x: 140, z: 100, radius: 40, height: 16 },
  { x: 30, z: 210, radius: 25, height: 9 },
  { x: -160, z: 320, radius: 50, height: 20 },
  { x: 200, z: -300, radius: 42, height: 17 },
  { x: -220, z: -350, radius: 33, height: 13 },
  { x: 250, z: 380, radius: 38, height: 15 },
  { x: -350, z: 620, radius: 55, height: 22 },
  { x: 400, z: -650, radius: 48, height: 19 },
  { x: -420, z: -720, radius: 40, height: 16 },
  { x: 380, z: 780, radius: 46, height: 18 },
  { x: -80, z: 880, radius: 35, height: 14 },
  { x: 60, z: -880, radius: 38, height: 15 },
  { x: -600, z: 1300, radius: 60, height: 24 },
  { x: 650, z: -1350, radius: 52, height: 21 },
  { x: -700, z: -1500, radius: 45, height: 18 },
  { x: 620, z: 1550, radius: 50, height: 20 },
  { x: -150, z: 1750, radius: 40, height: 16 },
  { x: 180, z: -1800, radius: 42, height: 17 }
];

// 編集モードで配置した丘(なだらかな盛り上がり)。{x, z, radius, height} の配列。
const editorHills = [];

function terrainHeight(x, z) {
  if (SUPERFLAT_MODE) {
    let h = 0;
    for (const hill of editorHills) {
      const dx = x - hill.x, dz = z - hill.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < hill.radius) {
        const t = 1 - dist / hill.radius;
        h += hill.height * t * t * (3 - 2 * t); // なめらかな盛り上がり(smoothstep型)
      }
    }
    return h;
  }
  if (ROUTE66_MODE) {
    let h = 0;
    for (const mesa of desertMesas) {
      const dx = x - mesa.x, dz = z - mesa.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < mesa.radius) {
        const t = 1 - dist / mesa.radius;
        h += mesa.height * t * t * (3 - 2 * t);
      }
    }
    // 全体にごくゆるやかな砂丘の起伏を足す
    h += Math.sin(x * 0.02) * 0.6 + Math.cos(z * 0.025) * 0.6;
    return h;
  }
  if (realElevationGrid) {
    return sampleRealElevation(x, z);
  }
  // フォールバック(簡易的な起伏)
  const factor = smoothstep(-60, -160, z);
  const rawHeight = Math.sin(x * 0.05) * 4 + Math.cos(z * 0.03) * 6;
  return rawHeight * factor;
}

// 道路面は地面のメッシュ(粗いグリッド)より少し高くしてあり、
// 車もこの分だけ高さを合わせて、タイヤが道路にめり込まないようにする
const ROAD_SURFACE_OFFSET = 0.3;

const groundSize = 4000;
const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize, 140, 140);
groundGeo.rotateX(-Math.PI / 2);

// 地形に起伏をつける(なめらかな高さ関数を使用)
const posAttr = groundGeo.attributes.position;
for (let i = 0; i < posAttr.count; i++) {
  const x = posAttr.getX(i);
  const z = posAttr.getZ(i);
  posAttr.setY(i, terrainHeight(x, z));
}
groundGeo.computeVertexNormals();

const groundMat = new THREE.MeshStandardMaterial({ color: ROUTE66_MODE ? 0xc7a771 : 0x4a7c3a, side: THREE.DoubleSide });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.receiveShadow = true;
scene.add(ground);
groundMeshes.push(ground);

// 地面に厚みを持たせるための土台(地形の一番低い場所より下に大きな箱を敷く)
const groundSlabMat = new THREE.MeshStandardMaterial({ color: 0x3a3025, roughness: 0.9 });
const groundSlab = new THREE.Mesh(new THREE.BoxGeometry(groundSize, 6, groundSize), groundSlabMat);
groundSlab.position.y = -6;
scene.add(groundSlab);

if (!SUPERFLAT_MODE && !ROUTE66_MODE) {
// 街エリア(中央付近)を示すプレースホルダーのビル群
const cityBuildings = new THREE.Group();
for (let i = 0; i < 25; i++) {
  const w = 6 + Math.random() * 8;
  const d = 6 + Math.random() * 8;
  const h = 10 + Math.random() * 30;
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({ color: 0x888888 + Math.floor(Math.random() * 0x333333) });
  const building = new THREE.Mesh(geo, mat);
  building.position.set(
    (Math.random() - 0.5) * 120,
    h / 2,
    (Math.random() - 0.5) * 80
  );
  building.castShadow = true;
  building.receiveShadow = true;
  cityBuildings.add(building);
}
scene.add(cityBuildings);

// 郊外エリア(手前側)を示すプレースホルダーの木
const trees = new THREE.Group();
for (let i = 0; i < 60; i++) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.4, 3, 6),
    new THREE.MeshStandardMaterial({ color: 0x5a3d1f })
  );
  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(2, 5, 8),
    new THREE.MeshStandardMaterial({ color: 0x2f6b2f })
  );
  leaves.position.y = 3.5;
  const tree = new THREE.Group();
  tree.add(trunk, leaves);
  tree.position.set(
    (Math.random() - 0.5) * 400,
    0,
    100 + Math.random() * 150
  );
  tree.castShadow = true;
  trees.add(tree);
}
scene.add(trees);
} // !SUPERFLAT_MODE (ビル・木)

// ==========================================================
// 道路(舗装路面+センターの破線+左右の白線)
// 街・郊外・山道の3エリアを通る、スプライン曲線でつながったループ状の道路
// ==========================================================
const roadMat = new THREE.MeshStandardMaterial({ color: 0x2b2b30, roughness: 0.9 });
const roadLineMat = new THREE.MeshBasicMaterial({ color: 0xf0f0e0 });

// 帯状(道路・白線共通)のジオメトリを、曲線上の点列から作る。
// 各点で進行方向の接線を計算して垂直方向にオフセットすることで、
// カーブ部分でも隙間なくつながった形になる。
function buildRibbonFromPoints(pts, halfWidth, heightOffset, material) {
  const n = pts.length;
  const positions = [];
  for (let i = 0; i < n; i++) {
    const cur = pts[i];
    const next = pts[(i + 1) % n];
    const prev = pts[(i - 1 + n) % n];
    const tangent = new THREE.Vector3().subVectors(next, prev).normalize();
    const perpX = tangent.z;
    const perpZ = -tangent.x;
    const h = terrainHeight(cur.x, cur.z) + heightOffset;
    positions.push(cur.x + perpX * halfWidth, h, cur.z + perpZ * halfWidth);
    positions.push(cur.x - perpX * halfWidth, h, cur.z - perpZ * halfWidth);
  }
  const indices = [];
  for (let i = 0; i < n; i++) {
    const a = i * 2, b = i * 2 + 1, c = ((i + 1) % n) * 2, d = ((i + 1) % n) * 2 + 1;
    indices.push(a, b, c, b, d, c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, material);
  mesh.receiveShadow = true;
  scene.add(mesh);
  groundMeshes.push(mesh);
}
function buildRoadFromWaypoints(waypoints, width) {
  const controlPoints = waypoints.map((p) => new THREE.Vector3(p.x, 0, p.z));
  const curve = new THREE.CatmullRomCurve3(controlPoints, true, 'catmullrom', 0.5);
  const pts = curve.getPoints(240);
  pts.pop(); // 閉曲線の終点は始点と重複するので取り除く

  // 舗装路面
  buildRibbonFromPoints(pts, width / 2, ROAD_SURFACE_OFFSET, roadMat);

  // 左右の白線
  const lineHalfWidth = 0.12;
  const edgeInset = width / 2 - 0.35;
  [-1, 1].forEach((side) => {
    const offsetPts = pts.map((p, i) => {
      const next = pts[(i + 1) % pts.length];
      const prev = pts[(i - 1 + pts.length) % pts.length];
      const tangent = new THREE.Vector3().subVectors(next, prev).normalize();
      const perpX = tangent.z;
      const perpZ = -tangent.x;
      return new THREE.Vector3(p.x + perpX * edgeInset * side, 0, p.z + perpZ * edgeInset * side);
    });
    buildRibbonFromPoints(offsetPts, lineHalfWidth, 0.32, roadLineMat);
  });

  // 中央の破線(道なりの距離を積算しながら等間隔に配置)
  const dashLen = 3;
  const gapLen = 3;
  const stepLen = dashLen + gapLen;
  let acc = 0;
  for (let i = 0; i < pts.length; i++) {
    const cur = pts[i];
    const next = pts[(i + 1) % pts.length];
    acc += cur.distanceTo(next);
    if (acc >= stepLen) {
      acc -= stepLen;
      const tangent = new THREE.Vector3().subVectors(next, cur).normalize();
      const angle = Math.atan2(tangent.x, tangent.z);
      const dashGeo = new THREE.PlaneGeometry(0.3, dashLen);
      dashGeo.rotateX(-Math.PI / 2);
      const dash = new THREE.Mesh(dashGeo, roadLineMat);
      dash.rotation.y = angle;
      dash.position.set(next.x, terrainHeight(next.x, next.z) + 0.32, next.z);
      scene.add(dash);
    }
  }

  return pts;
}

// ループしない開いた道(実際の通り)用の帯状ジオメトリ生成
function buildOpenRibbon(pts, halfWidth, heightOffset, material) {
  const n = pts.length;
  if (n < 2) return null;
  const positions = [];
  for (let i = 0; i < n; i++) {
    const cur = pts[i];
    const next = pts[Math.min(n - 1, i + 1)];
    const prev = pts[Math.max(0, i - 1)];
    const tangent = new THREE.Vector3().subVectors(next, prev);
    if (tangent.lengthSq() < 1e-8) tangent.set(0, 0, 1);
    tangent.normalize();
    const perpX = tangent.z;
    const perpZ = -tangent.x;
    const h = terrainHeight(cur.x, cur.z) + heightOffset;
    positions.push(cur.x + perpX * halfWidth, h, cur.z + perpZ * halfWidth);
    positions.push(cur.x - perpX * halfWidth, h, cur.z - perpZ * halfWidth);
  }
  const indices = [];
  for (let i = 0; i < n - 1; i++) {
    const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
    indices.push(a, b, c, b, d, c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, material || roadMat);
  mesh.receiveShadow = true;
  scene.add(mesh);
  groundMeshes.push(mesh);
  return mesh;
}

// OpenStreetMapの道路データ(way)から実際の通りを構築する
function buildRealRoadsFromOSM(elements) {
  const maxWays = 500; // 安全のための上限
  let count = 0;
  for (const el of elements) {
    if (el.type !== 'way' || !el.geometry) continue;
    if (count >= maxWays) break;
    const pts = el.geometry.map((g) => new THREE.Vector3(lonToWorldX(g.lon), 0, latToWorldZ(g.lat)));
    if (pts.length < 2) continue;
    buildOpenRibbon(pts, 3, ROAD_SURFACE_OFFSET, roadMat);
    count++;
  }
}

// ==========================================================
// 高速道路(高架。両端はスロープで地上の道とつながり、橋脚とガードレールを付ける)
// ==========================================================
function buildElevatedHighway(x1, z1, x2, z2, width, clearHeight, rampLength, roadMaterial, pillarMaterial) {
  const dx = x2 - x1;
  const dz = z2 - z1;
  const length = Math.sqrt(dx * dx + dz * dz);
  const perpX = dz / length;
  const perpZ = -dx / length;
  const steps = Math.max(2, Math.ceil(length / 6));
  const halfWidth = width / 2;
  const deckThickness = 0.8; // 橋桁の厚み

  // 各断面につき「上面左・上面右・下面左・下面右」の4頂点を作り、
  // 上面・下面・左右の側面をつなぐことで、橋桁に実際の厚みを持たせる。
  const positions = [];
  const centerPts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const dist = t * length;
    const cx = x1 + dx * t;
    const cz = z1 + dz * t;
    const baseGround = terrainHeight(cx, cz);
    let heightOffset;
    if (dist < rampLength) heightOffset = clearHeight * (dist / rampLength);
    else if (dist > length - rampLength) heightOffset = clearHeight * ((length - dist) / rampLength);
    else heightOffset = clearHeight;
    const yTop = baseGround + heightOffset + ROAD_SURFACE_OFFSET;
    const yBottom = yTop - deckThickness;
    const lx = cx + perpX * halfWidth, lz = cz + perpZ * halfWidth;
    const rx = cx - perpX * halfWidth, rz = cz - perpZ * halfWidth;
    positions.push(lx, yTop, lz);     // 0: 上面左
    positions.push(rx, yTop, rz);     // 1: 上面右
    positions.push(lx, yBottom, lz);  // 2: 下面左
    positions.push(rx, yBottom, rz);  // 3: 下面右
    centerPts.push({ x: cx, z: cz, y: yTop, heightOffset, dist });
  }

  const indices = [];
  for (let i = 0; i < steps; i++) {
    const a = i * 4, b = a + 1, c = a + 2, d = a + 3;
    const A = (i + 1) * 4, B = A + 1, C = A + 2, D = A + 3;
    // 上面
    indices.push(a, b, A, b, B, A);
    // 下面(裏側を向くよう巻き順を逆に)
    indices.push(c, C, d, d, C, D);
    // 左側面
    indices.push(a, c, A, c, C, A);
    // 右側面
    indices.push(b, B, d, d, B, D);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const road = new THREE.Mesh(geo, roadMaterial);
  road.receiveShadow = true;
  road.castShadow = true;
  scene.add(road);

  // ガードレール(道路の両端に沿わせる低い壁)
  const railMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.4, roughness: 0.5 });
  [-1, 1].forEach((side) => {
    for (let i = 0; i < centerPts.length - 1; i++) {
      const p = centerPts[i];
      const next = centerPts[i + 1];
      const segLen = Math.hypot(next.x - p.x, next.z - p.z);
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, segLen + 0.05), railMat);
      const midX = (p.x + next.x) / 2 + perpX * halfWidth * side;
      const midZ = (p.z + next.z) / 2 + perpZ * halfWidth * side;
      const midY = (p.y + next.y) / 2 + 0.25;
      rail.position.set(midX, midY, midZ);
      rail.rotation.y = Math.atan2(next.x - p.x, next.z - p.z);
      scene.add(rail);
    }
  });

  // 橋脚(高架になっている区間だけ、一定間隔で設置)
  const pillarSpacing = 15;
  let nextPillarDist = rampLength;
  centerPts.forEach((p) => {
    if (p.heightOffset > clearHeight * 0.9 && p.dist >= nextPillarDist) {
      const pillarHeight = p.heightOffset + ROAD_SURFACE_OFFSET - 0.2;
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, pillarHeight, 10), pillarMaterial);
      pillar.position.set(p.x, terrainHeight(p.x, p.z) + pillarHeight / 2, p.z);
      pillar.castShadow = true;
      scene.add(pillar);
      nextPillarDist += pillarSpacing;
    }
  });
}

// 複数の点をなめらかな曲線でつなぐランプ(合流時に道路の向きに沿わせるために使う)
function buildCurvedRamp(waypoints, width, clearHeightStart, clearHeightEnd, material, pillarMaterial) {
  const controlPoints = waypoints.map((p) => new THREE.Vector3(p.x, 0, p.z));
  const curve = new THREE.CatmullRomCurve3(controlPoints, false, 'catmullrom', 0.5);
  const pts = curve.getPoints(60);
  const n = pts.length;
  const deckThickness = 0.6;
  const halfWidth = width / 2;

  // 累積距離を計算
  const cumDist = [0];
  for (let i = 1; i < n; i++) {
    cumDist.push(cumDist[i - 1] + pts[i].distanceTo(pts[i - 1]));
  }
  const totalDist = cumDist[n - 1];

  const positions = [];
  const centerPts = [];
  for (let i = 0; i < n; i++) {
    const cur = pts[i];
    const next = pts[Math.min(n - 1, i + 1)];
    const prev = pts[Math.max(0, i - 1)];
    const tangent = new THREE.Vector3().subVectors(next, prev);
    if (tangent.lengthSq() < 1e-8) tangent.set(0, 0, 1);
    tangent.normalize();
    const perpX = tangent.z, perpZ = -tangent.x;
    const t = totalDist > 0 ? cumDist[i] / totalDist : 0;
    const heightOffset = clearHeightStart + (clearHeightEnd - clearHeightStart) * t;
    const yTop = terrainHeight(cur.x, cur.z) + heightOffset + ROAD_SURFACE_OFFSET;
    const yBottom = yTop - deckThickness;
    const lx = cur.x + perpX * halfWidth, lz = cur.z + perpZ * halfWidth;
    const rx = cur.x - perpX * halfWidth, rz = cur.z - perpZ * halfWidth;
    positions.push(lx, yTop, lz, rx, yTop, rz, lx, yBottom, lz, rx, yBottom, rz);
    centerPts.push({ x: cur.x, z: cur.z, y: yTop, heightOffset, perpX, perpZ });
  }

  const indices = [];
  for (let i = 0; i < n - 1; i++) {
    const a = i * 4, b = a + 1, c = a + 2, d = a + 3;
    const A = (i + 1) * 4, B = A + 1, C = A + 2, D = A + 3;
    indices.push(a, b, A, b, B, A);
    indices.push(c, C, d, d, C, D);
    indices.push(a, c, A, c, C, A);
    indices.push(b, B, d, d, B, D);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const deck = new THREE.Mesh(geo, material);
  deck.receiveShadow = true;
  deck.castShadow = true;
  scene.add(deck);
  groundMeshes.push(deck);

  const railMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.4, roughness: 0.5 });
  [-1, 1].forEach((side) => {
    for (let i = 0; i < n - 1; i++) {
      const p = centerPts[i], next = centerPts[i + 1];
      const segLen = Math.hypot(next.x - p.x, next.z - p.z);
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, segLen + 0.05), railMat);
      rail.position.set(
        (p.x + next.x) / 2 + p.perpX * halfWidth * side,
        (p.y + next.y) / 2 + 0.2,
        (p.z + next.z) / 2 + p.perpZ * halfWidth * side
      );
      rail.rotation.y = Math.atan2(next.x - p.x, next.z - p.z);
      scene.add(rail);
    }
  });

  const pillarSpacing = 12;
  let nextPillarDist = 8;
  centerPts.forEach((p, i) => {
    if (p.heightOffset > 1.5 && cumDist[i] >= nextPillarDist) {
      const pillarHeight = p.heightOffset + ROAD_SURFACE_OFFSET - 0.15;
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.65, pillarHeight, 10), pillarMat);
      pillar.position.set(p.x, terrainHeight(p.x, p.z) + pillarHeight / 2, p.z);
      pillar.castShadow = true;
      scene.add(pillar);
      nextPillarDist += pillarSpacing;
    }
  });
}

const highwayMat = new THREE.MeshStandardMaterial({ color: 0x4a4a52, roughness: 0.85, side: THREE.DoubleSide });
const pillarMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.8 });
const highwayClearHeight = 9;

// 高速道路本体(街の周りをぐるっと回る、常に一定の高さを保つ高架ループ)
function buildElevatedLoop(waypoints, width, clearHeight, roadMaterial, pillarMaterial) {
  const controlPoints = waypoints.map((p) => new THREE.Vector3(p.x, 0, p.z));
  const curve = new THREE.CatmullRomCurve3(controlPoints, true, 'catmullrom', 0.5);
  const rawPts = curve.getPoints(150);
  rawPts.pop();
  const count = rawPts.length;
  const deckThickness = 0.8;
  const halfWidth = width / 2;

  const positions = [];
  const centerPts = [];
  for (let i = 0; i < count; i++) {
    const cur = rawPts[i];
    const next = rawPts[(i + 1) % count];
    const prev = rawPts[(i - 1 + count) % count];
    const tangent = new THREE.Vector3().subVectors(next, prev).normalize();
    const perpX = tangent.z, perpZ = -tangent.x;
    const yTop = terrainHeight(cur.x, cur.z) + clearHeight + ROAD_SURFACE_OFFSET;
    const yBottom = yTop - deckThickness;
    const lx = cur.x + perpX * halfWidth, lz = cur.z + perpZ * halfWidth;
    const rx = cur.x - perpX * halfWidth, rz = cur.z - perpZ * halfWidth;
    positions.push(lx, yTop, lz, rx, yTop, rz, lx, yBottom, lz, rx, yBottom, rz);
    centerPts.push({ x: cur.x, z: cur.z, y: yTop, perpX, perpZ });
  }

  const indices = [];
  for (let i = 0; i < count; i++) {
    const ni = (i + 1) % count;
    const a = i * 4, b = a + 1, c = a + 2, d = a + 3;
    const A = ni * 4, B = A + 1, C = A + 2, D = A + 3;
    indices.push(a, b, A, b, B, A);   // 上面
    indices.push(c, C, d, d, C, D);   // 下面
    indices.push(a, c, A, c, C, A);   // 左側面
    indices.push(b, B, d, d, B, D);   // 右側面
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const deck = new THREE.Mesh(geo, roadMaterial);
  deck.receiveShadow = true;
  deck.castShadow = true;
  scene.add(deck);
  groundMeshes.push(deck);

  // ガードレール
  const railMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.4, roughness: 0.5 });
  [-1, 1].forEach((side) => {
    for (let i = 0; i < count; i++) {
      const p = centerPts[i], next = centerPts[(i + 1) % count];
      const segLen = Math.hypot(next.x - p.x, next.z - p.z);
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, segLen + 0.05), railMat);
      rail.position.set(
        (p.x + next.x) / 2 + p.perpX * halfWidth * side,
        (p.y + next.y) / 2 + 0.25,
        (p.z + next.z) / 2 + p.perpZ * halfWidth * side
      );
      rail.rotation.y = Math.atan2(next.x - p.x, next.z - p.z);
      scene.add(rail);
    }
  });

  // 橋脚(一定間隔)
  let acc = 0;
  const spacing = 15;
  for (let i = 0; i < count; i++) {
    const p = centerPts[i], next = centerPts[(i + 1) % count];
    acc += Math.hypot(next.x - p.x, next.z - p.z);
    if (acc >= spacing) {
      acc -= spacing;
      const pillarHeight = p.y - ROAD_SURFACE_OFFSET - terrainHeight(p.x, p.z);
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, pillarHeight, 10), pillarMaterial);
      pillar.position.set(p.x, terrainHeight(p.x, p.z) + pillarHeight / 2, p.z);
      pillar.castShadow = true;
      scene.add(pillar);
    }
  }
  return rawPts;
}

// 街(中心付近)の外側をぐるっと回るよう、ループ道路のウェイポイントを外側に拡大して使う
const highwayLoopWaypoints = roadWaypoints.map((p) => ({ x: p.x * 1.7, z: p.z * 1.7 }));
const highwayPoints = buildElevatedLoop(highwayLoopWaypoints, 12, highwayClearHeight, highwayMat, pillarMat);

// 一般道路(地上のループ)から高速道路への合流ランプを1か所作る(東側)
if (loopRoadPoints) {
  let groundIndex = -1, bestGroundDist = Infinity;
  for (let i = 0; i < loopRoadPoints.length; i++) {
    const p = loopRoadPoints[i];
    const dz = Math.abs(p.z - 40);
    if (p.x > 0 && dz < bestGroundDist) { bestGroundDist = dz; groundIndex = i; }
  }
  const groundJunction = loopRoadPoints[groundIndex];
  // 合流開始地点での道路の向き(接線)を求める
  const gNext = loopRoadPoints[(groundIndex + 1) % loopRoadPoints.length];
  const gPrev = loopRoadPoints[(groundIndex - 1 + loopRoadPoints.length) % loopRoadPoints.length];
  const roadTangent = new THREE.Vector3().subVectors(gNext, gPrev).normalize();

  let highwayJunction = null, bestPairDist = Infinity;
  for (const p of highwayPoints) {
    const d = Math.hypot(p.x - groundJunction.x, p.z - groundJunction.z);
    if (d < bestPairDist) { bestPairDist = d; highwayJunction = p; }
  }

  // 道路の右側(進行方向に向かって右)の方向ベクトル
  const roadRightX = roadTangent.z;
  const roadRightZ = -roadTangent.x;

  // ランプは道路本線(groundJunction)から始まり、右側へ分岐しながら
  // 高速道路へ登っていく1本の連続したカーブにする(つなぎ目のズレを防ぐ)
  const forkOffset = 8; // 道路脇までの距離
  const rampStart = {
    x: groundJunction.x + roadRightX * forkOffset,
    z: groundJunction.z + roadRightZ * forkOffset
  };
  const parallelDist = 22;
  const mergeStart = {
    x: rampStart.x + roadTangent.x * parallelDist + roadRightX * 6,
    z: rampStart.z + roadTangent.z * parallelDist + roadRightZ * 6
  };
  buildCurvedRamp(
    [groundJunction, rampStart, mergeStart, highwayJunction],
    8, 0, highwayClearHeight, highwayMat, pillarMat
  );

  // ランプ入口の案内標識(緑の看板。ブランド表記なしのシンプルなもの)
  // ランプの通り道(右側へforkOffset分ずれた位置)から十分離し、車に当たらないようにする
  const signPoleMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.5, roughness: 0.4 });
  const signBoardMat = new THREE.MeshStandardMaterial({ color: 0x1a7a3a, roughness: 0.7 });
  const signStripeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });

  const rampDirX = roadTangent.x;
  const rampDirZ = roadTangent.z;
  const signSideX = roadRightX;
  const signSideZ = roadRightZ;
  const signBaseX = groundJunction.x + signSideX * 18;
  const signBaseZ = groundJunction.z + signSideZ * 18;
  const signGroundY = terrainHeight(signBaseX, signBaseZ);

  const signPole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4.5, 8), signPoleMat);
  signPole.position.set(signBaseX, signGroundY + 2.25, signBaseZ);
  scene.add(signPole);

  const signBoard = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.6, 0.1), signBoardMat);
  signBoard.position.set(signBaseX, signGroundY + 4.2, signBaseZ);
  signBoard.rotation.y = Math.atan2(-rampDirX, -rampDirZ); // ランプに向けて表示面を向ける
  scene.add(signBoard);

  const signStripe = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.15, 0.11), signStripeMat);
  signStripe.position.set(signBaseX, signGroundY + 4.5, signBaseZ);
  signStripe.rotation.y = signBoard.rotation.y;
  scene.add(signStripe);
}

if (ROUTE66_MODE) {

    const cactus = new THREE.Group();
    const trunkH = 2 + Math.random() * 2.5;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, trunkH, 8), cactusMat);
    trunk.position.y = trunkH / 2;
    cactus.add(trunk);
    if (Math.random() < 0.7) {
      [-1, 1].forEach((armSide) => {
        if (Math.random() < 0.6) {
          const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.25, 1.4, 6), cactusMat);
          arm.position.set(armSide * 0.5, trunkH * 0.55, 0);
          arm.rotation.z = armSide * 0.6;
          cactus.add(arm);
        }
      });
    }
    cactus.position.set(x, y, z);
    cactus.castShadow = false;
    scene.add(cactus);
    cactusObstacles.push({ mesh: cactus, x, z, radius: 0.6 });
  }

  // 岩(小さめの転石を点在させる)。個別メッシュではなくInstancedMeshにまとめることで、
  // 何百個あっても描画コールが1回で済むようにする(岩は壊れず常に存在するため、
  // サボテンのような個別の距離カリングは不要)
  const smallRockMat = new THREE.MeshStandardMaterial({ color: 0x8a6a52, roughness: 1.0 });
  const rockGeo = new THREE.DodecahedronGeometry(1, 0);
  const rockCount = 180;
  const rockMesh = new THREE.InstancedMesh(rockGeo, smallRockMat, rockCount);
  rockMesh.castShadow = false;
  rockMesh.receiveShadow = true;
  const rockDummy = new THREE.Object3D();
  let rocksPlaced = 0;
  let rockAttempts = 0;
  while (rocksPlaced < rockCount && rockAttempts < rockCount * 20) {
    rockAttempts++;
    const x = (Math.random() - 0.5) * 2800;
    const z = -1900 + Math.random() * 3800;
    if (Math.abs(x) < 9) continue; // 道の上を避ける
    const y = terrainHeight(x, z);
    const size = 0.6 + Math.random() * 1.2;
    rockDummy.position.set(x, y + size * 0.4, z);
    rockDummy.rotation.set(Math.random(), Math.random(), Math.random());
    rockDummy.scale.setScalar(size);
    rockDummy.updateMatrix();
    rockMesh.setMatrixAt(rocksPlaced, rockDummy.matrix);
    rockObstacles.push({ x, z, radius: size * 0.9 });
    rocksPlaced++;
  }
  rockMesh.count = rocksPlaced;
  rockMesh.instanceMatrix.needsUpdate = true;
  scene.add(rockMesh);

  // 「ROUTE 66」の道路標識(キャンバステクスチャで文字を描く、ブランド表記なしのオリジナルデザイン)
  function buildRoute66Sign(x, z) {
    const y = terrainHeight(x, z);

// 角を面取り(チャンファー)したボックス形状を作るヘルパー
// 断面(幅×高さ)の四隅を斜めにカットした形をZ方向(車の前後方向)に押し出す。
// 直角の箱よりもカクカクした印象を抑えられる。
function createChamferedBox(width, height, depth, chamfer) {
  const w = width / 2;
  const h = height / 2;
  const c = Math.min(chamfer, w * 0.9, h * 0.9);

  const shape = new THREE.Shape();
  shape.moveTo(-w + c, -h);
  shape.lineTo(w - c, -h);
  shape.lineTo(w, -h + c);
  shape.lineTo(w, h - c);
  shape.lineTo(w - c, h);
  shape.lineTo(-w + c, h);
  shape.lineTo(-w, h - c);
  shape.lineTo(-w, -h + c);

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: depth,
    bevelEnabled: false,
    curveSegments: 1
  });
  geo.translate(0, 0, -depth / 2);
  return geo;
}

// スピードメーター(画面右下に固定表示。薄い背景+速度に応じて動く針)
const speedGaugeCanvas = document.getElementById('speedGauge');
const speedGaugeCtx = speedGaugeCanvas.getContext('2d');
const gaugeSize = speedGaugeCanvas.width; // 150
const gaugeCenter = gaugeSize / 2;
const gaugeRadius = gaugeSize / 2 - 10;
const gaugeMaxKmh = 220; // 針が右いっぱいに振れる速度
const gaugeStartAngle = Math.PI * 0.75;  // 目盛りの開始角度(左下)
const gaugeEndAngle = Math.PI * 2.25;    // 目盛りの終了角度(右下)

function updateSpeedDisplay() {
  const ctx = speedGaugeCtx;
  const kmh = Math.round(Math.abs(carState.speed) * 6);

  ctx.clearRect(0, 0, gaugeSize, gaugeSize);

  // 薄い(半透明の)円形の背景
  ctx.beginPath();
  ctx.arc(gaugeCenter, gaugeCenter, gaugeRadius, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.stroke();

  // 目盛り
  const tickCount = 11;
  for (let i = 0; i < tickCount; i++) {
    const t = i / (tickCount - 1);
    const angle = gaugeStartAngle + (gaugeEndAngle - gaugeStartAngle) * t;
    const innerR = gaugeRadius - 10;
    const outerR = gaugeRadius - 2;
    const x1 = gaugeCenter + Math.cos(angle) * innerR;
    const y1 = gaugeCenter + Math.sin(angle) * innerR;
    const x2 = gaugeCenter + Math.cos(angle) * outerR;
    const y2 = gaugeCenter + Math.sin(angle) * outerR;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // 針(速度に応じて回転)
  const speedRatio = Math.min(1, kmh / gaugeMaxKmh);
  const needleAngle = gaugeStartAngle + (gaugeEndAngle - gaugeStartAngle) * speedRatio;
  const needleLength = gaugeRadius - 16;
  ctx.beginPath();
  ctx.moveTo(gaugeCenter, gaugeCenter);
  ctx.lineTo(
    gaugeCenter + Math.cos(needleAngle) * needleLength,
    gaugeCenter + Math.sin(needleAngle) * needleLength
  );
  ctx.strokeStyle = 'rgba(255, 60, 60, 0.9)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // 針の中心のハブ
  ctx.beginPath();
  ctx.arc(gaugeCenter, gaugeCenter, 4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.fill();

  // 濃くはっきりした速度の数字
  ctx.fillStyle = 'rgba(15, 15, 15, 0.92)';
  ctx.font = 'bold 26px sans-serif';

// センターのT字形エンブレム(丸いバッジの代わり)
// 端に向かって太くなる(先端が広がる)棒状の形状を作るヘルパー
// lengthは棒の長さ(ローカルY方向)、minThickは中央部の太さ、maxThickは端の太さ
function createFlaredBar(length, minThick, maxThick, depth) {
  const halfLen = length / 2;
  const narrowY = halfLen * 0.35; // 中央の細い部分の範囲

  const shape = new THREE.Shape();
  shape.moveTo(-maxThick / 2, -halfLen);
  shape.lineTo(-minThick / 2, -narrowY);
  shape.lineTo(-minThick / 2, narrowY);
  shape.lineTo(-maxThick / 2, halfLen);
  shape.lineTo(maxThick / 2, halfLen);
  shape.lineTo(minThick / 2, narrowY);
  shape.lineTo(minThick / 2, -narrowY);
  shape.lineTo(maxThick / 2, -halfLen);

  const geo = new THREE.ExtrudeGeometry(shape, { depth: depth, bevelEnabled: false, curveSegments: 1 });
  geo.translate(0, 0, -depth / 2);
  return geo;
}

function createSmokeTexture() {
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gradient.addColorStop(0, 'rgba(235,235,235,0.85)');
  gradient.addColorStop(0.5, 'rgba(200,200,200,0.4)');
  gradient.addColorStop(1, 'rgba(200,200,200,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}
const smokeTexture = createSmokeTexture();
const smokeParticles = [];

function spawnSmoke(x, y, z) {
  const mat = new THREE.SpriteMaterial({
    map: smokeTexture, transparent: true, opacity: 0.55, depthWrite: false
  });
  const sprite = new THREE.Sprite(mat);
  const startScale = 0.4 + Math.random() * 0.2;
  sprite.position.set(x + (Math.random() - 0.5) * 0.2, y, z + (Math.random() - 0.5) * 0.2);
  sprite.scale.set(startScale, startScale, startScale);
  scene.add(sprite);
  smokeParticles.push({
    sprite,
    life: 0,
    maxLife: 0.5 + Math.random() * 0.4,
    startScale,
    vx: (Math.random() - 0.5) * 0.8,
    vy: 0.6 + Math.random() * 0.4,
    vz: (Math.random() - 0.5) * 0.8
  });
}

function updateSmoke(dt) {
  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    const p = smokeParticles[i];
    p.life += dt;
    const t = p.life / p.maxLife;
    if (t >= 1) {
      scene.remove(p.sprite);
      p.sprite.material.dispose();
      smokeParticles.splice(i, 1);
      continue;
    }
    p.sprite.position.x += p.vx * dt;
    p.sprite.position.y += p.vy * dt;
    p.sprite.position.z += p.vz * dt;
    const scale = p.startScale * (1 + t * 2.2);
    p.sprite.scale.set(scale, scale, scale);
    p.sprite.material.opacity = 0.55 * (1 - t);
  }
}

const carState = {
  speed: 0,
  velocity: new THREE.Vector3(), // 実際に車体が動く方向・速さ(向いている方向とはズレることがある=ドリフト)
  maxSpeed: 45,
  maxReverseSpeed: -15,
  acceleration: 18,
  braking: 30,
  friction: 8,
  turnSpeed: 3.8,
  pitch: 0,
  roll: 0
};

// ハンドル(3Dオブジェクト)の見た目上の回転角
let steeringWheelAngle = 0;
const steeringWheelMaxAngle = Math.PI * 0.45;
const steeringWheelTurnSpeed = 3.0;
const steeringWheelReturnSpeed = 3.0;

function updateCar(dt) {
  const accelInput = isPressed('arrowup', 'w');
  const brakeInput = isPressed('arrowdown', 's');
  const leftInput = isPressed('arrowleft', 'a');
  const rightInput = isPressed('arrowright', 'd');
  const handbrakeInput = isPressed(' ');

  // ハンドルの見た目の回転(左右キーに応じて回し、離すと中央に戻る)
  if (leftInput && !rightInput) {
    steeringWheelAngle = Math.max(-steeringWheelMaxAngle, steeringWheelAngle - steeringWheelTurnSpeed * dt);
  } else if (rightInput && !leftInput) {
    steeringWheelAngle = Math.min(steeringWheelMaxAngle, steeringWheelAngle + steeringWheelTurnSpeed * dt);
  } else {
    steeringWheelAngle *= Math.max(0, 1 - steeringWheelReturnSpeed * dt);
  }
  steeringWheel.rotation.z = steeringWheelAngle;

  if (accelInput) {
    carState.speed += carState.acceleration * dt;
  } else if (brakeInput) {
    carState.speed -= carState.braking * dt;
  } else {
    // 自然減速
    if (carState.speed > 0) carState.speed = Math.max(0, carState.speed - carState.friction * dt);
    else if (carState.speed < 0) carState.speed = Math.min(0, carState.speed + carState.friction * dt);
  }

  carState.speed = Math.max(carState.maxReverseSpeed, Math.min(carState.maxSpeed, carState.speed));

  // サイドブレーキ: 少し減速しつつ、後輪のグリップを抜いてドリフトのきっかけを作る
  if (handbrakeInput) {
    carState.speed *= Math.max(0, 1 - 1.2 * dt);
  }

  // ある程度速度が乗っていないと曲がれないようにする(簡易ハンドリング)
  // サイドブレーキ中はより鋭く曲がれる(オーバーステア)
  const turnBoost = handbrakeInput ? 1.7 : 1.0;
  const turnFactor = Math.min(1, Math.abs(carState.speed) / 2.5);
  if (Math.abs(carState.speed) > 0.05) {
    const dir = carState.speed > 0 ? 1 : -1;
    if (leftInput) car.rotation.y += carState.turnSpeed * turnBoost * dt * turnFactor * dir;
    if (rightInput) car.rotation.y -= carState.turnSpeed * turnBoost * dt * turnFactor * dir;
  }

  const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(car.quaternion);
  const desiredVelocity = forward.clone().multiplyScalar(carState.speed);

  // グリップ: 通常はタイヤの向きにすぐ速度が追従するが、サイドブレーキ中はグリップが
  // 大きく下がり、実際に進む向き(velocity)が車体の向きから遅れてズレる=ドリフトする
  const gripRate = handbrakeInput ? 1.6 : 18;
  const gripBlend = 1 - Math.exp(-gripRate * dt);
  carState.velocity.lerp(desiredVelocity, gripBlend);

  car.position.addScaledVector(carState.velocity, dt);

  // サボテン・岩との簡易的な当たり判定(車を単純な円とみなして判定する)
  const carCollisionRadius = 1.7;
  for (let i = cactusObstacles.length - 1; i >= 0; i--) {
    const obs = cactusObstacles[i];
    const dx = car.position.x - obs.x, dz = car.position.z - obs.z;
    const dist = Math.hypot(dx, dz);
    const minDist = carCollisionRadius + obs.radius;
    if (dist < minDist) {
      // サボテンは当たったら消えるが、なぎ倒す反動として少しだけ車を押し戻す
      const nx = dist > 0.0001 ? dx / dist : 1, nz = dist > 0.0001 ? dz / dist : 0;
      const push = (minDist - dist) * 0.3; // 岩より弱めの押し戻し
      car.position.x += nx * push;
      car.position.z += nz * push;
      scene.remove(obs.mesh);
      cactusObstacles.splice(i, 1);
    }
  }
  for (const obs of rockObstacles) {
    const dx = car.position.x - obs.x, dz = car.position.z - obs.z;
    const dist = Math.hypot(dx, dz);
    const minDist = carCollisionRadius + obs.radius;
    if (dist < minDist) {
      // 岩は硬い障害物として扱い、めり込んだ分だけ車を押し戻して減速させる
      const nx = dist > 0.0001 ? dx / dist : 1, nz = dist > 0.0001 ? dz / dist : 0;
      const push = minDist - dist;
      car.position.x += nx * push;
      car.position.z += nz * push;
      carState.speed *= 0.4;
    }
  }

  // 4輪の実際の位置(ホイールベース・トレッド幅)で地形の高さを測り、
  // それをもとに車の高さと前後・左右の傾きを決める(タイヤが確実に接地するように)
  const yaw = car.rotation.y;
  const fx = Math.sin(yaw), fz = Math.cos(yaw);
  const rx = Math.cos(yaw), rz = -Math.sin(yaw);
  const halfTrack = 1.05;  // ホイールの左右オフセット
  const halfWheelbase = 1.55; // ホイールの前後オフセット

  function wheelGroundHeight(sideSign, frontSign) {
    const wx = car.position.x + rx * halfTrack * sideSign + fx * halfWheelbase * frontSign;
    const wz = car.position.z + rz * halfTrack * sideSign + fz * halfWheelbase * frontSign;
    return getGroundHeight(wx, wz);
  }

  const hFL = wheelGroundHeight(-1, 1);
  const hFR = wheelGroundHeight(1, 1);
  const hRL = wheelGroundHeight(-1, -1);
  const hRR = wheelGroundHeight(1, -1);

  // ドリフト中(サイドブレーキ+ある程度の速度)は、後輪の位置から煙を出す
  if (handbrakeInput && Math.abs(carState.speed) > 3) {
    const rlx = car.position.x + rx * halfTrack * -1 + fx * halfWheelbase * -1;
    const rlz = car.position.z + rz * halfTrack * -1 + fz * halfWheelbase * -1;
    const rrx = car.position.x + rx * halfTrack * 1 + fx * halfWheelbase * -1;
    const rrz = car.position.z + rz * halfTrack * 1 + fz * halfWheelbase * -1;
    if (Math.random() < 0.9) spawnSmoke(rlx, hRL + 0.3, rlz);
    if (Math.random() < 0.9) spawnSmoke(rrx, hRR + 0.3, rrz);
  }

  // 車の高さは4輪の平均の接地面に合わせる
  car.position.y = (hFL + hFR + hRL + hRR) / 4;

  // 坂道の傾斜に応じて車体を前後(ピッチ)・左右(ロール)に傾ける
  const hFrontAvg = (hFL + hFR) / 2;
  const hRearAvg = (hRL + hRR) / 2;
  const hRightAvg = (hFR + hRR) / 2;
  const hLeftAvg = (hFL + hRL) / 2;

  const pitchTarget = Math.atan2(hFrontAvg - hRearAvg, halfWheelbase * 2) * 2.2;
  const rollTarget = Math.atan2(hRightAvg - hLeftAvg, halfTrack * 2);

  carState.pitch += (pitchTarget - carState.pitch) * 0.25;
  carState.roll += (rollTarget - carState.roll) * 0.15;
  car.rotation.x = carState.pitch;
  car.rotation.z = carState.roll;

  updateSpeedDisplay();
  updateDistanceCulling();
}

// タイヤの真上からレイを飛ばし、実際に描画されている道路・地面メッシュのうち
// 一番高い位置にある面を「接地面」として使う(高架のランプや高速道路もこれで正しく判定できる)
function getGroundHeight(x, z) {
  groundRaycaster.set(new THREE.Vector3(x, 1000, z), new THREE.Vector3(0, -1, 0));
  const hits = groundRaycaster.intersectObjects(groundMeshes, false);
  if (hits.length > 0) return hits[0].point.y;
  return terrainHeight(x, z); // 万一メッシュが見つからない場合のフォールバック
}

// 追従カメラ(マウスで視点を回転できる軌道カメラ)
// ==========================================================
const cameraLookOffset = new THREE.Vector3(0, 1.5, 0);
const camDistance = 7;
const camBaseHeight = 1.6;
let camYaw = 0;      // 車の向きに対する追加の左右回転
let camPitch = 0.28; // 上下の見上げ/見下ろし角度(ラジアン)
const camPitchMin = 0.05;
const camPitchMax = 1.56; // ほぼ真上(垂直)近くまで見上げられる
const yawSensitivity = 0.006;
const pitchSensitivity = 0.005;

// ポインターロックはプレビュー環境(iframe)で許可されないことがあるため、
// マウスボタン(またはタッチ)を押している間だけドラッグで視点を回す方式にする。
// Pointer Eventsとポインターキャプチャを使うことで、素早い動きでも
// ドラッグの追跡が途切れないようにしている。
renderer.domElement.style.touchAction = 'none';
let isDragging = false;
let lastPointerX = 0;
let lastPointerY = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  isDragging = true;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastPointerX;
  const dy = e.clientY - lastPointerY;
  lastPointerX = e.clientX;
  lastPointerY = e.clientY;

  camYaw -= dx * yawSensitivity;
  camPitch += dy * pitchSensitivity;
  camPitch = Math.max(camPitchMin, Math.min(camPitchMax, camPitch));
});

renderer.domElement.addEventListener('pointerup', (e) => {
  isDragging = false;
  renderer.domElement.releasePointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointercancel', () => {
  isDragging = false;
});

// 音源を置くと、この一覧の並び順で選局できるようになる。
// 曲を増やしたり名前を変えたりしたときは、下の配列をそれに合わせて書き換える。
const radioLabel = document.getElementById('radioLabel');
const radioStations = [
  { name: 'ラジオ 1', file: 'audio/radio1.mp3' },
  { name: 'ラジオ 2', file: 'audio/radio2.mp3' },
  { name: 'ラジオ 3', file: 'audio/radio3.mp3' }
];
let radioIndex = -1; // まだ何も再生していない状態。最初に「;」を押すと1局目から始まる
const radioAudio = new Audio();
radioAudio.loop = true;
radioAudio.volume = 0.5;

function playRadioStation(index) {
  radioIndex = ((index % radioStations.length) + radioStations.length) % radioStations.length;
  const station = radioStations[radioIndex];
  radioAudio.src = station.file;
  radioAudio.play().catch(() => {
    // ブラウザの自動再生制限で失敗した場合は、次に「-」「;」キーを押したときに再生される
  });
  if (radioLabel) radioLabel.textContent = `♪ ${station.name}`;
}

window.addEventListener('keydown', (e) => {
  if (editMode) return;
  if (e.key === '-') {
    playRadioStation(radioIndex - 1);
  } else if (e.key === ';') {
    playRadioStation(radioIndex + 1);
  }
});

// ==========================================================
// クラクション(Hキー)
// ==========================================================
// ラジオと同じく、audioフォルダに horn.mp3 という名前で音源を置くと鳴るようになる。
// ファイル名を変える場合は下のパスを書き換える。
const hornAudio = new Audio('audio/horn.mp3');
hornAudio.volume = 0.9;

window.addEventListener('keydown', (e) => {
  if (editMode) return;
  if (e.key.toLowerCase() === 'h') {
    hornAudio.currentTime = 0;
    hornAudio.play().catch(() => {});
  }
});

// ==========================================================
// マップ(Mキーで開閉)
// ==========================================================
const mapOverlay = document.getElementById('mapOverlay');
const mapCanvas = document.getElementById('mapCanvas');
const mapCtx = mapCanvas.getContext('2d');
let mapOpen = false;

window.addEventListener('keydown', (e) => {
  if (editMode) return;
  if (e.key.toLowerCase() === 'm') {
    mapOpen = !mapOpen;
    mapOverlay.classList.toggle('active', mapOpen);
  }
});

function drawMap() {
  const w = mapCanvas.width, h = mapCanvas.height;
  mapCtx.fillStyle = '#d8c9a3';
  mapCtx.fillRect(0, 0, w, h);

  // ワールド座標をマップのキャンバス座標に変換する(全体が収まるスケールにする)
  const worldHalf = groundSize / 2;
  const scale = (Math.min(w, h) * 0.45) / worldHalf;
  const toMap = (x, z) => ({ mx: w / 2 + x * scale, mz: h / 2 + z * scale });

  // メサ(岩山)
  mapCtx.fillStyle = '#a97c50';
  desertMesas.forEach((mesa) => {
    const p = toMap(mesa.x, mesa.z);
    mapCtx.beginPath();
    mapCtx.arc(p.mx, p.mz, Math.max(2, mesa.radius * scale), 0, Math.PI * 2);
    mapCtx.fill();
  });

  // 道路(ルート66モードは南北にまっすぐ1本)
  if (ROUTE66_MODE) {
    const p1 = toMap(0, -worldHalf);
    const p2 = toMap(0, worldHalf);
    mapCtx.strokeStyle = '#555';
    mapCtx.lineWidth = 3;
    mapCtx.beginPath();
    mapCtx.moveTo(p1.mx, p1.mz);
    mapCtx.lineTo(p2.mx, p2.mz);
    mapCtx.stroke();
  }

  // 車(現在位置と向き)
  const carP = toMap(car.position.x, car.position.z);
  const yaw = car.rotation.y;
  const fx = Math.sin(yaw), fz = Math.cos(yaw); // 前方向
  const rx = Math.cos(yaw), rz = -Math.sin(yaw); // 右方向
  const size = 11;
  const tip = { x: carP.mx + fx * size, y: carP.mz + fz * size };
  const left = { x: carP.mx - fx * size * 0.6 + rx * size * 0.6, y: carP.mz - fz * size * 0.6 + rz * size * 0.6 };
  const right = { x: carP.mx - fx * size * 0.6 - rx * size * 0.6, y: carP.mz - fz * size * 0.6 - rz * size * 0.6 };
  mapCtx.fillStyle = '#e04040';
  mapCtx.beginPath();
  mapCtx.moveTo(tip.x, tip.y);
  mapCtx.lineTo(left.x, left.y);
  mapCtx.lineTo(right.x, right.y);
  mapCtx.closePath();
  mapCtx.fill();
}

function updateCamera(dt) {
  if (cameraMode === 'firstPerson') {
    updateFirstPersonCamera(dt);
  } else {
    updateChaseCamera(dt);
  }
}

function updateChaseCamera(dt) {
  const totalYaw = car.rotation.y + camYaw;
  // 水平方向の距離と高さを別々に計算することで、
  // 角度を上げてもカメラが地面より下に潜り込まないようにする
  const horizontalDist = camDistance * Math.cos(camPitch);
  const height = camDistance * Math.sin(camPitch) + camBaseHeight;

  const desiredPos = new THREE.Vector3(
    car.position.x - Math.sin(totalYaw) * horizontalDist,
    car.position.y + height,
    car.position.z - Math.cos(totalYaw) * horizontalDist
  );

  camera.position.lerp(desiredPos, 1 - Math.pow(0.001, dt));

  const lookTarget = car.position.clone().add(cameraLookOffset);
  camera.lookAt(lookTarget);
}

function updateFirstPersonCamera(dt) {
  // 運転席の目線位置に、車の向き(quaternion)をそのまま適用する
  const worldOffset = firstPersonOffset.clone().applyQuaternion(car.quaternion);
  camera.position.copy(car.position).add(worldOffset);

  // マウスのドラッグ(camYaw/camPitch)で視線を左右・上下に振れるようにする
  const lookYaw = car.rotation.y + camYaw;
  const lookPitch = -(camPitch - 0.28) - 0.12; // 三人称のデフォルト角度分を差し引いて正面を基準にし、上下方向を反転。初期視線をやや下向きに
  const lookDir = new THREE.Vector3(
    Math.sin(lookYaw) * Math.cos(lookPitch),
    Math.sin(lookPitch),
    Math.cos(lookYaw) * Math.cos(lookPitch)
  );
  const lookTarget = camera.position.clone().add(lookDir);
  camera.lookAt(lookTarget);
}

// ==========================================================
// メインループ
// ==========================================================
let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  updateCar(dt);
  updateCamera(dt);
  updateSmoke(dt);
  if (mapOpen) drawMap();

  // バックミラーの描画
  updateMirrorCamera();
  updateSideMirrorCameras();

  // ルームミラーは車内(後部座席など)も映るようにする
  renderer.setRenderTarget(mirrorRenderTarget);
  renderer.render(scene, mirrorCamera);

  // サイドミラーは外の景色を映すため、自車のボディを一時的に隠す
  car.visible = false;
  sideMirrorCams.forEach((cam, i) => {
    renderer.setRenderTarget(sideMirrorRTs[i]);
    renderer.render(scene, cam);
  });
  car.visible = true;

  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
}

// ==========================================================
// 開発者用編集モード(Eキーで切り替え)
// クリックでビル・木・目印を配置し、Pキーで配置データをJSONとして書き出せる。
// 書き出したデータを渡してもらえれば、実際のマップに反映できる。
// ==========================================================
const editorPanel = document.getElementById('editorPanel');
const editorTypeLabel = document.getElementById('editorTypeLabel');
const editorExportBox = document.getElementById('editorExport');

let editMode = false;
let editObjects = [];
let editObjectMeshes = [];
const editTypeNames = { '1': 'building', '2': 'tree', '3': 'marker', '4': 'road', '5': 'hill' };
let currentEditType = 'building';
let editorRoadLastPoint = null; // 道路を連続して置いているときの直前の点

function createEditorPlaceholder(type) {
  if (type === 'building') {
    const h = 10 + Math.random() * 20;
    const w = 6 + Math.random() * 6;
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, w),
      new THREE.MeshStandardMaterial({ color: 0x8899aa })
    );
    mesh.userData.halfHeight = h / 2;
    mesh.castShadow = true;
    return mesh;
  } else if (type === 'tree') {
    const group = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.4, 3, 6),
      new THREE.MeshStandardMaterial({ color: 0x5a3d1f })
    );
    trunk.position.y = 1.5;
    const leaves = new THREE.Mesh(
      new THREE.ConeGeometry(2, 5, 8),
      new THREE.MeshStandardMaterial({ color: 0x2f6b2f })
    );
    leaves.position.y = 5;
    group.add(trunk, leaves);
    group.userData.halfHeight = 0;
    return group;
  } else {
    const mesh = new THREE.Mesh(
      new THREE.ConeGeometry(0.5, 1.2, 8),
      new THREE.MeshStandardMaterial({ color: 0xff6600 })
    );
    mesh.userData.halfHeight = 0.6;
    return mesh;
  }
}

// 地面のメッシュを、現在のterrainHeight(丘を含む)に合わせて作り直す
function regenerateGroundMesh() {
  const posAttr = groundGeo.attributes.position;
  for (let i = 0; i < posAttr.count; i++) {
    const x = posAttr.getX(i);
    const z = posAttr.getZ(i);
    posAttr.setY(i, terrainHeight(x, z));
  }
  posAttr.needsUpdate = true;
  groundGeo.computeVertexNormals();
}

function placeEditObject(type, x, z) {
  if (type === 'hill') {
    // 丘を1つ追加して、地面を作り直す
    const hill = { x, z, radius: 15, height: 6 };
    editorHills.push(hill);
    regenerateGroundMesh();
    editObjects.push({ type: 'hill', x: Math.round(x * 100) / 100, z: Math.round(z * 100) / 100, radius: hill.radius, height: hill.height });
    editObjectMeshes.push(null); // 専用メッシュはない(取り消しはeditorHillsから外して地面を作り直す)
    return;
  }

  if (type === 'road') {
    // 直前の道路の点があれば、そこから今回の点までを舗装でつなぐ
    let segmentMesh = null;
    if (editorRoadLastPoint) {
      const pts = [
        new THREE.Vector3(editorRoadLastPoint.x, 0, editorRoadLastPoint.z),
        new THREE.Vector3(x, 0, z)
      ];
      segmentMesh = buildOpenRibbon(pts, 4, ROAD_SURFACE_OFFSET, roadMat);
    }
    editorRoadLastPoint = { x, z };
    editObjectMeshes.push(segmentMesh); // 最初の点はnull(まだつなぐ区間がない)
    editObjects.push({ type: 'road', x: Math.round(x * 100) / 100, z: Math.round(z * 100) / 100 });
    return;
  }

  // ビル・木・目印
  const y = terrainHeight(x, z);
  const mesh = createEditorPlaceholder(type);
  mesh.position.set(x, y + (mesh.userData.halfHeight || 0), z);
  scene.add(mesh);
  editObjectMeshes.push(mesh);
  editObjects.push({ type, x: Math.round(x * 100) / 100, z: Math.round(z * 100) / 100 });
}

function undoLastEditObject() {
  if (editObjects.length === 0) return;
  const last = editObjects.pop();
  const mesh = editObjectMeshes.pop();
  function removeMesh(m) {
    scene.remove(m);
    const idx = groundMeshes.indexOf(m);
    if (idx !== -1) groundMeshes.splice(idx, 1);
  }
  if (last.type === 'hill') {
    editorHills.pop();
    regenerateGroundMesh();
  } else if (last.type === 'road') {
    if (mesh) removeMesh(mesh); // 直前の区間を消す
    // 道路の連続配置を1つ前の点に戻す(その前も道路の点であれば)
    const prevRoad = [...editObjects].reverse().find((o) => o.type === 'road');
    editorRoadLastPoint = prevRoad ? { x: prevRoad.x, z: prevRoad.z } : null;
  } else if (mesh) {
    removeMesh(mesh);
  }
}

function exportEditObjects() {
  editorExportBox.value = JSON.stringify(editObjects, null, 2);
  editorExportBox.style.display = 'block';
  editorExportBox.focus();
  editorExportBox.select();
}

const editRaycaster = new THREE.Raycaster();
const editMouseNDC = new THREE.Vector2();

renderer.domElement.addEventListener('click', (e) => {
  if (!editMode) return;
  const rect = renderer.domElement.getBoundingClientRect();
  editMouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  editMouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  editRaycaster.setFromCamera(editMouseNDC, camera);
  const hits = editRaycaster.intersectObject(ground);
  if (hits.length > 0) {
    placeEditObject(currentEditType, hits[0].point.x, hits[0].point.z);
  }
});

window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === 'e') {
    editMode = !editMode;
    editorPanel.classList.toggle('active', editMode);
    if (!editMode) editorExportBox.style.display = 'none';
    return;
  }
  if (!editMode) return;
  if (editTypeNames[key]) {
    currentEditType = editTypeNames[key];
    editorTypeLabel.textContent = currentEditType;
  } else if (key === 'z') {
    undoLastEditObject();
  } else if (key === 'p') {
    exportEditObjects();
  } else if (key === 'r') {
    editorRoadLastPoint = null; // 新しい道路をここから始める
  }
});

animate();
})();
</script>
